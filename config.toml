base_url = "https://123shivanshukumar.github.io"
title = "Shivanshu Kumar"
description = "Notes, essays and resources on math, computer science and whatever else is on my mind."
author = "Shivanshu Kumar"

default_language = "en"
compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [{ name = "tags", feed = false }]

[markdown]
highlight_code = true
highlight_theme = "subway-madrid"
smart_punctuation = false
bottom_footnotes = true

# ---------------------------------------------------------------------------
# Languages.
# Adding a translation language = add a block here, nothing else.
#   1. add   [languages.xx]  below  (+ its taxonomies line)
#   2. add   xx = "Native name"  under [extra.language_names]
#   3. write content/posts/my-post.xx.md  and  content/posts/_index.xx.md
# ---------------------------------------------------------------------------
[languages.ta]
title = "Shivanshu Kumar"
description = "எண்ணங்கள், கட்டுரைகள்"
generate_feeds = true
taxonomies = [{ name = "tags", feed = false }]

[languages.hi]
title = "Shivanshu Kumar"
description = "विचार और लेख"
generate_feeds = true
taxonomies = [{ name = "tags", feed = false }]

[languages.de]
title = "Shivanshu Kumar"
generate_feeds = true
taxonomies = [{ name = "tags", feed = false }]

[languages.bn]
title = "Shivanshu Kumar"
generate_feeds = true
taxonomies = [{ name = "tags", feed = false }]

