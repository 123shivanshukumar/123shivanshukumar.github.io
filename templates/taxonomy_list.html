{% extends "base.html" %}

{% block title %}Tags &middot; {{ config.title }}{% endblock %}

{% block content %}
<header class="page-head"><h1>Tags</h1></header>
<ul class="tag-cloud">
  {% for term in terms %}
  <li><a class="tag" href="{{ term.permalink }}">{{ term.name }} <span class="count">{{ term.pages | length }}</span></a></li>
  {% endfor %}
</ul>
{% endblock %}
